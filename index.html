<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <title>3D App</title>
  </head>
  <body>
    <img class="image-gradient" src="img/gradient.png" alt="gradient" />
    <div class="layer-blur"></div>

    <div class="container">
      <header>
        <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">
          3dAPP
        </h1>

        <nav>
          <a data-aos="fade-down" data-aos-duration="1750" href="">COMPANY</a>
          <a data-aos="fade-down" data-aos-duration="2000" href="">FEATURES</a>
          <a data-aos="fade-down" data-aos-duration="2250" href="">RESOURCES</a>
          <a data-aos="fade-down" data-aos-duration="2500" href="">DOCUMENTS</a>
        </nav>

        <button
          data-aos="fade-down"
          data-aos-duration="1500"
          class="btn-signing"
        >
          Sign-in
        </button>
      </header>
      <main>
        <div class="content">
          <div
            data-aos="fade-zoom-in"
            data-aos-easing="ease-in-back"
            data-aos-delay="300"
            data-aos-offset="0"
            class="tag-box"
            data-aos-duration="1500"
          >
            <div class="tag">INTRUCING</div>
          </div>

          <h1 data-aos="fade-right" data-aos-duration="1000">
            BUILD IN <br/> 3D
          </h1>

          <p class="description" data-aos="fade-right" data-aos-duration="1250">
            Bring your product to life with interactive 3D. Smooth animations,
            modern UI, and a Spline-powered hero scene-ready to customize and ship.
          </p>

          <div class="buttons">
            <a
              data-aos="fade-up"
              data-aos-duration="1000"
              href="#"
              class="btn-get-started"
              >Documentation ⭢</a
            >
            <a
              data-aos="fade-up"
              data-aos-duration="1250"
              href="#"
              class="btn-signing-main"
              >Getstarted ⭢</a
            >
          </div>
        </div>
      </main>
      <spline-viewer
        data-aos="zoom-in"
        data-aos-duration="1500"
        class="robot-3d"
        url="https://prod.spline.design/1zTmDT9fMFjaYbMf/scene.splinecode"
      ></spline-viewer>
    </div>
    <script
      type="module"
      src="https://unpkg.com/@splinetool/viewer@1.12.51/build/spline-viewer.js"
    ></script>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();
    </script>
  </body>
</html>
